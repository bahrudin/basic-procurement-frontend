<!DOCTYPE html>
<html lang="en">
<head>
    <title>Item List</title>
    <link rel="icon" href="data:,">
    <!-- CDN -->
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
<div class="bg-secondary text-white px-4 py-2">
    <div class="d-flex align-items-center">

        <!--Menu -->
        <div class="d-flex gap-3">
            <a href="dashboard.html" class="text-white text-decoration-none">Dashboard</a>
            <a href="purchase_list.html" class="text-white text-decoration-none">Procurement</a>
            <a href="items.html" class="text-white text-decoration-none">Item</a>
            <a href="suppliers.html" class="text-white text-decoration-none">Supplier</a>
        </div>

        <!-- Spacer -->
        <div class="ms-auto">
            <button id="btnLogout" class="btn btn-danger btn-sm">
                Logout
            </button>
        </div>
    </div>
</div>

<!-- Content-->
<div  class="container">
    <div class="d-flex justify-content-between align-items-center mb-3">
        <h3>Item</h3>
    </div>

    <button class="btn btn-success btn-sm mb-3" id="btnAddItem">Add Item</button>

    <table class="table table-bordered table-striped">
        <thead class="table-secondary">
        <tr>
            <th>Name</th>
            <th>Stock</th>
            <th>Price</th>
            <th>Actions</th>
        </tr>
        </thead>
        <tbody id="itemTable"></tbody>
    </table>
</div>

<!--Modal-->

<div class="modal fade" id="itemModal" tabindex="-1">
    <div class="modal-dialog">
        <div class="modal-content">
            <form id="itemForm">
                <div class="modal-header">
                    <h5 class="modal-title" id="itemModalTitle">Add Item</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body">
                    <input type="hidden" id="itemId">
                    <div class="mb-3">
                        <label>Name</label>
                        <input type="text" id="itemName" class="form-control" required>
                    </div>
                    <div class="mb-3">
                        <label>Stock</label>
                        <input type="number" id="itemStock" class="form-control" required>
                    </div>
                    <div class="mb-3">
                        <label>Price</label>
                        <input type="number" id="itemPrice" class="form-control" required>
                    </div>
                </div>
                <div class="modal-footer">
                    <button type="submit" class="btn btn-primary">Save</button>
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
                </div>
            </form>
        </div>
    </div>
</div>

<!-- JS Assets -->
<script src="assets/js/config.js"></script>
<script src="assets/js/auth.js"></script>
<script src="assets/js/items.js"></script>

</body>
</html>
