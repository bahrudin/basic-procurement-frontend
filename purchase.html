<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Create Purchase</title>
  <link rel="icon" href="data:,">

  <!-- Bootstrap CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>

<!-- Header / Menu -->
<div class="bg-secondary text-white px-4 py-2">
  <div class="d-flex align-items-center">

    <!-- Menu -->
    <div class="d-flex gap-3">
      <a href="dashboard.html" class="text-white text-decoration-none">Dashboard</a>
      <a href="purchase_list.html" class="text-white text-decoration-none">Procurement</a>
      <a href="items.html" class="text-white text-decoration-none">Item</a>
      <a href="suppliers.html" class="text-white text-decoration-none">Supplier</a>
    </div>

    <!-- Logout -->
    <div class="ms-auto">
      <button id="btnLogout" class="btn btn-danger btn-sm">Logout</button>
    </div>
  </div>
</div>

<!-- Content -->
<div class="container mt-4">
  <h3>Create Purchase</h3>

  <!-- Supplier -->
  <select id="supplierSelect" class="form-select mb-3"></select>

  <!-- Item input -->
  <div class="d-flex gap-2 mb-3">
    <select id="itemSelect" class="form-select"></select>
    <input id="qty" type="number" class="form-control" placeholder="Qty">
    <button id="addItem" class="btn btn-primary">Add</button>
  </div>

  <!-- Cart table -->
  <table class="table table-bordered table-striped">
    <thead class="table-secondary">
    <tr>
      <th>Item</th>
      <th>Qty</th>
      <th>Subtotal</th>
      <th>Action</th>
    </tr>
    </thead>
    <tbody id="cartTable"></tbody>
  </table>

  <!-- Total -->
  <h4>Total: <span id="total">0</span></h4>

  <button id="submit" class="btn btn-success">Submit</button>
</div>

<!-- CDN JS -->
<script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>

<!-- JS Assets -->
<script src="assets/js/config.js"></script>
<script src="assets/js/auth.js"></script>
<script src="assets/js/purchase.js"></script>

</body>
</html>
