<!DOCTYPE html>
<html lang="en">
<head>
  <title>Purchase Detail</title>

  <!-- CDN -->
  <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">

  <!-- Global Config -->
  <script src="assets/js/config.js"></script>
</head>
<body class="container mt-4">

<h3>Purchase Detail</h3>

<div class="card mb-3">
  <div class="card-body">
    <p><strong>Supplier:</strong> <span id="supplierName">-</span></p>
    <p><strong>User:</strong> <span id="username">-</span></p>
    <p><strong>Date:</strong> <span id="purchaseDate">-</span></p>
    <p><strong>Grand Total:</strong> Rp <span id="grandTotal">0</span></p>
  </div>
</div>

<table class="table table-bordered">
  <thead>
  <tr>
    <th>Item</th>
    <th>Qty</th>
    <th>Price</th>
    <th>Sub Total</th>
  </tr>
  </thead>
  <tbody id="detailTable"></tbody>
</table>

<a href="purchase_list.html" class="btn btn-secondary">
  Back
</a>

<script src="assets/js/purchase_detail.js"></script>
</body>
</html>
